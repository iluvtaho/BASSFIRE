[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bassfire_comp"
version = "0.2.1"
description = "BASS/BASS-II to SAFFIRE run-pair comparability finder"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]

[project.scripts]
bassfire_comp = "bassfire_comp.cli:main"

[tool.setuptools.packages.find]
include = ["bassfire_comp*"]

[tool.setuptools.package-data]
bassfire_comp = ["demo_data/runs/*.csv", "demo_data/planned/*.csv"]
